spring.application.name=car-rental-backend

# Database configuration (Works with both local MySQL and Railway/Cloud MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:car_rental}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:1234}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema management (Auto-creates tables on fresh databases)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Port (Railway/Cloud assigns dynamic $PORT, defaults to 8080)
server.port=${PORT:8080}

# JWT & Security
app.jwt.secret=${JWT_SECRET:CarRentalProductionSecretKey2026_MinLen32BytesOK!}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}

logging.level.com.carrental=INFO
